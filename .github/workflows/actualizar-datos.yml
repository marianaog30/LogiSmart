name: Actualizar datos sanitizados y publicar
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar exportador con entradas válidas e inválidas
        run: python3 -m unittest discover -s tests -p 'test_exportar_datos.py' -v
      - name: Leer exclusivamente el endpoint público sanitizado
        run: python3 scripts/exportar_datos.py
      - name: Validar datos, fórmulas y archivos antes de guardar o publicar
        run: node scripts/validar.mjs
      - name: Versionar únicamente la exportación sanitizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/datos/cotizaciones.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar exportación sanitizada de LogiSmart'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
