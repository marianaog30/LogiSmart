name: Verificar y publicar LogiSmart
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      actualizar_datos:
        description: 'Consultar historial sanitizado de n8n antes de publicar'
        type: boolean
        default: true
      probar_fallo:
        description: 'Demostrar bloqueo: altera un dato solo en el runner; no publica'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar datos públicos desde n8n
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_datos == true) }}
        run: python3 scripts/exportar_datos.py
      - name: Inyectar inconsistencia deliberada solo en prueba manual
        if: ${{ inputs.probar_fallo == true }}
        run: node -e "const fs=require('fs');const p='web/datos/cotizaciones.json';const d=JSON.parse(fs.readFileSync(p));d.total_registros++;fs.writeFileSync(p,JSON.stringify(d));"
      - name: Validar datos, fórmulas y archivos
        run: node scripts/validar.mjs
      - name: Probar exportación y skills sin llamadas de pago
        run: python3 -m unittest discover -s tests -v
      - name: Verificar políticas de los workflows actuales sin API
        run: node tests/probar_actuales.cjs
      - name: Verificar componentes con entradas sintéticas sin API
        run: node tests/probar_componentes.cjs
      - name: Probar importación local y cálculo de propuestas
        run: node tests/probar_archivos.cjs
      - name: Auditar costos sin duplicaciones
        run: python3 scripts/auditar_costos.py
      - name: Comprobar archivos esenciales y enlaces de entrega
        run: python3 scripts/verificar_paquete.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
